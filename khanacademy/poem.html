<!DOCTYPE HTML>

        <title>Challenge: Write a Poem</title>
        <meta charset="utf-8">

    <body>
        <h1>Poem</h1>
            <p>
            I woke up early with the sun in my eyes <br>
            A quiet street and a clear blue sky <br>
            No rushing sounds, no heavy noise <br>
            Just morning calm and peaceful joys
            </p>
